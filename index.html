<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/5364cb27d7.js"
      crossorigin="anonymous"
    ></script>
    <title>Blinky Editor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-left">Blinky</div>
      <ul class="nav-links">
        <a href="#contact-info"><li>Contact</li></a>
      </ul>
    </nav>
    <div class="container">
      <div class="info">
        <h1>Short-form Video Editor</h1>
        <p class="info-text">
          Specialized in Short-form retention editing for different niches
          across YouTube Shorts, TikTok, and Instagram Reels
        </p>
      </div>
      <h2 class="video-header">My Work</h2>
      <div class="video-container">
        <div class="videos">
          <video controls autoplay muted loop>
            <source src="videos/video-one.mp4" type="video/mp4" />
          </video>
          <video controls autoplay muted loop>
            <source src="videos/video-two.mp4" type="video/mp4" />
          </video>
          <video controls autoplay muted loop>
            <source src="videos/video-three.mp4" />
          </video>
          <video controls autoplay muted loop>
            <source src="videos/video-four.mp4" />
          </video>
        </div>
      </div>
    </div>
    <footer>
      <div class="contact">
        <h3>Contact</h3>
        <div id="contact-info">
          <span class="icon">
            <i class="fa-regular fa-envelope"></i>
          </span>
          <span> the3dbean@gmail.com </span> <br />
          <span class="icon">
            <i class="fa-brands fa-discord"></i>
            <span> blinkyisgone </span>
          </span>
        </div>
      </div>
      <p>Website created by Blinky 2026</p>
    </footer>
  </body>
</html>
